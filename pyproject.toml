[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ataflow"
version = "2.1.0"
description = "AtaFlow - Transcritor e gerador de atas de reunioes com TUI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.0.3",
    "pyaudiowpatch>=0.2.12",
    "numpy>=1.26",
    "textual>=0.80.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "google-genai>=2.20.0",
    "mcp>=1.28,<2",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.24.0.43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
]

[project.scripts]
transcriber = "main:run"
ataflow-mcp = "ataflow_mcp:run"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["agy_tui", "agy_voice"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
[tool.hatch.build.targets.wheel]
packages = [
    "agy_tui",
    "agy_voice"
]

[tool.hatch.build.targets.wheel.force-include]
"ataflow_mcp.py" = "ataflow_mcp.py"
"mcp_settings.py" = "mcp_settings.py"
"mcp_network.py" = "mcp_network.py"
